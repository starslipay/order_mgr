Name: ordermgr.rpc
ListenOn: 0.0.0.0:8080
Timeout: 10000
Etcd:
  Hosts:
  - etcd:2379
  Key: ordermgr.rpc

MasterDBConfig:
  # DataSource: root:root123456@tcp(mysql-primary.pay-ns.svc.cluster.local:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # K8S
  DataSource: root:root123456@tcp(mysql-master:3306)/order_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # 本地开发环境

SlaveDBConfig:
  # DataSource: starslipay:payClipayA2026@tcp(mysql-slave.pay-ns.svc.cluster.local:3306)/account_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s #K8S
  DataSource: root:root123456@tcp(mysql-master:3306)/order_db?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s # 本地开发环境

# Prometheus 指标采集：go-zero 会另起一个独立 HTTP 端口暴露 /metrics
Prometheus:
  Host: 0.0.0.0
  Port: 9090
  Path: /metrics

# 链路追踪：go-zero 通过 OTLP 协议发送 trace 到 Tempo
Telemetry:
  Name: order_mgr
  Endpoint: tempo:4318
  Batcher: otlphttp
  Sampler: 1.0

# AccessLog: 请求/响应日志记录(按字段名脱敏)
AccessLog:
  Enable: true
  SensitiveFields:
    - password
    - user_token
    - old_password
    - new_password
    - pay_password
