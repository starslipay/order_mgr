syntax = "proto3";

package order_mgr;
// 相对路径;包名
option go_package = "./order_mgr_pb";

message OrderInfo {
    string transaction_id = 1;
    string out_order_no = 2;
    string merchant_id = 3;
    int64 merchant_uid = 4;
    string merchant_name = 5;
    string user_id = 6;
    int64 uid = 7;
    int64 amount = 8;
    string pay_time = 9;
    int32 trade_state = 10;
    string order_success_token = 11;
}

message BanPayPreOrderReq {
    string transaction_id = 1;
    string out_order_no = 2;
    string merchant_id = 3;
    int64 merchant_uid = 4;
    string merchant_name = 5;
    string user_id = 6;
    int64 uid = 7;
    int64 amount = 8;
}

message BanPayPreOrderRsp {
    string transaction_id = 1;
}

message BanPaySuccessOrderReq {
    string transaction_id = 1;
    string out_order_no = 2;
    string merchant_id = 3;
    int64 merchant_uid = 4;
    string user_id = 5;
    int64 uid = 6;
    int64 amount = 7;
    string pay_time = 8;
    string deduct_token = 9;  // 扣款签名
}

message BanPaySuccessOrderRsp {
    OrderInfo order_info = 1;
}

message CloseOrderReq {
    string transaction_id = 1;
}

message CloseOrderRsp {
    string transaction_id = 1;
}

message QueryOrderReq {
    string transaction_id = 1;
}

message QueryOrderRsp {
    OrderInfo order_info = 1;
}

// 退款请求
message RefundOrderReq {
    string transaction_id = 1;
    string refund_time = 2;
}

// 退款响应
message RefundOrderRsp {
    string transaction_id = 1;
}

// 充值提现单信息
message RechargeWithdrawOrderInfo {
    string transaction_id = 1;          // 充值提现单号(trade_itg Bank2CPre/C2BankPre生成)
    string channel_transaction_id = 2;  // 银行渠道单号(bank_channel生成)
    string user_id = 3;                 // 用户ID
    int64 uid = 4;                      // 用户uid
    int32 biz_type = 5;                 // 业务类型: 1=充值(Bank2C) 2=提现(C2Bank)
    int32 bank_type = 6;                // 银行类型
    int64 amount = 7;                   // 金额
    int32 cur_type = 8;                 // 货币类型
    int32 trade_state = 9;              // 交易状态: 1=初始 2=成功 3=失败
    string memo = 10;                   // 备注
    string create_time = 11;            // 创建时间
    string update_time = 12;            // 更新时间
}

// 创建充值提现单请求
message CreateRechargeWithdrawOrderReq {
    string transaction_id = 1;          // 充值提现单号(trade_itg Bank2CPre/C2BankPre生成)
    string channel_transaction_id = 2;  // 银行渠道单号(bank_channel生成)
    string user_id = 3;                 // 用户ID
    int64 uid = 4;                      // 用户uid
    int32 biz_type = 5;                 // 业务类型: 1=充值(Bank2C) 2=提现(C2Bank)
    int32 bank_type = 6;                // 银行类型
    int64 amount = 7;                   // 金额
    int32 cur_type = 8;                 // 货币类型
    string memo = 9;                    // 备注
}

// 创建充值提现单响应
message CreateRechargeWithdrawOrderRsp {
    string transaction_id = 1;
}

// 更新充值提现单状态请求
message UpdateRechargeWithdrawOrderStateReq {
    string transaction_id = 1;  // 充值提现单号
    int32 trade_state = 2;      // 目标交易状态: 2=成功 3=失败
}

// 更新充值提现单状态响应
message UpdateRechargeWithdrawOrderStateRsp {
    string transaction_id = 1;
}

// 查询充值提现单请求
message QueryRechargeWithdrawOrderReq {
    string transaction_id = 1;  // 充值提现单号
}

// 查询充值提现单响应
message QueryRechargeWithdrawOrderRsp {
    RechargeWithdrawOrderInfo order_info = 1;
}

service OrderMgr {    
    rpc BanPayPreOrder(BanPayPreOrderReq) returns (BanPayPreOrderRsp);
    rpc BanPaySuccessOrder(BanPaySuccessOrderReq) returns (BanPaySuccessOrderRsp);
    rpc CloseOrder(CloseOrderReq) returns (CloseOrderRsp);
    rpc QueryOrder(QueryOrderReq) returns (QueryOrderRsp);
    rpc RefundOrder(RefundOrderReq) returns (RefundOrderRsp);
    // 创建充值提现单(初始状态)
    rpc CreateRechargeWithdrawOrder(CreateRechargeWithdrawOrderReq) returns (CreateRechargeWithdrawOrderRsp);
    // 更新充值提现单状态(成功/失败)
    rpc UpdateRechargeWithdrawOrderState(UpdateRechargeWithdrawOrderStateReq) returns (UpdateRechargeWithdrawOrderStateRsp);
    // 查询充值提现单
    rpc QueryRechargeWithdrawOrder(QueryRechargeWithdrawOrderReq) returns (QueryRechargeWithdrawOrderRsp);
}
